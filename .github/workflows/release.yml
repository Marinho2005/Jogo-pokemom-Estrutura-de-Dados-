name: Build e Release Multiplataforma

on:
  push:
    branches:
      - main
      - distribuicao-portavel
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar e Empacotar (Windows x64)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Instalar Dependências de Compilação Cruzada
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip curl

      - name: Gerar Pacote Windows (ZIP)
        run: bash scripts/package_windows.sh

      - name: Salvar Artefato Windows
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Windows-x64
          path: dist/PokeRogue-Windows-x64.zip
          retention-days: 14

  build-linux:
    name: Compilar e Empacotar (Linux AppImage e .deb)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev imagemagick curl dpkg

      - name: Gerar Pacotes Linux (AppImage e .deb)
        run: bash scripts/package_linux.sh

      - name: Salvar Artefato AppImage Linux
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Linux-AppImage
          path: dist/PokeRogue-Linux-x86_64.AppImage
          retention-days: 14

      - name: Salvar Artefato DEB Linux
        uses: actions/upload-artifact@v4
        with:
          name: PokeRogue-Linux-DEB
          path: dist/pokerogue_1.0.0_amd64.deb
          retention-days: 14

  publish-release:
    name: Publicar no GitHub Releases
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Baixar Artefato Windows
        uses: actions/download-artifact@v4
        with:
          name: PokeRogue-Windows-x64
          path: dist/

      - name: Baixar Artefato AppImage
        uses: actions/download-artifact@v4
        with:
          name: PokeRogue-Linux-AppImage
          path: dist/

      - name: Baixar Artefato DEB
        uses: actions/download-artifact@v4
        with:
          name: PokeRogue-Linux-DEB
          path: dist/

      - name: Criar Release no GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PokeRogue-Windows-x64.zip
            dist/PokeRogue-Linux-x86_64.AppImage
            dist/pokerogue_1.0.0_amd64.deb
          generate_release_notes: true
          title: "PokeRogue AED - Lançamento Oficial"
